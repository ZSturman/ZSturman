name: Update profile README from Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate README from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PROJECTS_DB_ID: ${{ secrets.NOTION_PROJECTS_DB_ID }}
          NOTION_WORK_LOG_DB_ID: ${{ secrets.NOTION_WORK_LOG_DB_ID }}
          NOTION_PERSONAL_LINKS_DB_ID: ${{ secrets.NOTION_PERSONAL_LINKS_DB_ID }}
          NOTION_MILESTONES_DB_ID: ${{ secrets.NOTION_MILESTONES_DB_ID }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
          NOTION_RESOURCES_DB_ID: ${{ secrets.NOTION_RESOURCES_DB_ID }}
          NOTION_AUTOMATION_LOGS_DB_ID: ${{ secrets.NOTION_AUTOMATION_LOGS_DB_ID }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: npm run generate-readme

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README from Notion"
          git push
